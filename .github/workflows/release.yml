# Signed release on a version tag (git tag v0.2.0 && git push origin v0.2.0):
#   1. desktop: ARC-22 Studio installers for Linux (AppImage, .deb), Windows (installer + portable .exe)
#      and macOS (.dmg, .zip) built from docs/app with Electron
#   2. release: manufacturing ZIP (print files, STEP, BOM, pin-by-pin wiring, harness, build docs),
#      source ZIP + CycloneDX SBOM + SHA256SUMS.txt over everything, a Sigstore-backed
#      build-provenance attestation, and the GitHub Release itself.
# No firmware binary is shipped. The installers are NOT code-signed: Windows SmartScreen and
# macOS Gatekeeper will warn on first launch (docs/APP.md explains how to open them).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: dist:linux
          - os: windows-2022
            target: dist:win
          - os: macos-14
            target: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install (lockfile only)
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Stamp version and repository
        working-directory: app
        shell: bash
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm pkg set homepage="https://github.com/${GITHUB_REPOSITORY}"
          npm pkg set repository.url="https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Build installers
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*-mac-*.zip

  release:
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Package source + manufacturing ZIP + SBOM + checksums
        shell: bash
        run: |
          python -m pip install PyYAML==6.0.3 matplotlib==3.10.9
          python tools/build_mfg.py --no-render --package --version "${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=arc22-scanner/ -o dist/arc22-scanner-${GITHUB_REF_NAME}-source.zip HEAD
          python tools/make_sbom.py > dist/arc22-scanner-${GITHUB_REF_NAME}.sbom.cdx.json
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="arc22-manufacturing ZIP (print files, STEP, BOM, wiring, harness, build guide), ARC-22 Studio desktop installers (unsigned), source ZIP, SBOM and checksums. See docs/VALIDATION.md for what is and is not verified. Check downloads with sha256sum -c SHA256SUMS.txt and gh attestation verify FILE -R $GITHUB_REPOSITORY"
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$NOTES"
